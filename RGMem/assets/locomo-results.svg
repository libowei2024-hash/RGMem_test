<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">LOCOMO benchmark results</title>
  <desc id="desc">Comparison of RGMem with RAG, LangMem, Mem0, Zep, and Full-Context using gpt-4o-mini and gpt-4.1-mini.</desc>
  <style>
    text { font-family: Georgia, "Times New Roman", serif; fill: #182033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #586174; }
    .head { font-size: 21px; font-weight: 700; }
    .model { font-size: 20px; font-style: italic; fill: #36415a; }
    .cell { font-size: 21px; }
    .best { font-size: 21px; font-weight: 700; fill: #173d75; }
    .oracle { font-size: 21px; font-style: italic; }
    .rule { stroke: #1d2638; stroke-width: 2; }
    .thin { stroke: #aeb7c7; stroke-width: 1; }
  </style>

  <rect width="1000" height="820" rx="18" fill="#ffffff"/>
  <text x="500" y="48" text-anchor="middle" class="title">LOCOMO Benchmark Results (%)</text>
  <text x="500" y="77" text-anchor="middle" class="subtitle">LLM-as-a-judge evaluation</text>

  <line x1="35" y1="100" x2="965" y2="100" class="rule"/>
  <text x="55" y="137" class="head">Method</text>
  <text x="380" y="137" text-anchor="middle" class="head">S-Hop</text>
  <text x="520" y="137" text-anchor="middle" class="head">M-Hop</text>
  <text x="655" y="137" text-anchor="middle" class="head">Open</text>
  <text x="785" y="137" text-anchor="middle" class="head">Temp.</text>
  <text x="920" y="137" text-anchor="middle" class="head">Avg.</text>
  <line x1="35" y1="155" x2="965" y2="155" class="rule"/>

  <rect x="35" y="162" width="930" height="38" rx="7" fill="#f0f3f8"/>
  <text x="55" y="189" class="model">gpt-4o-mini</text>

  <text x="55" y="232" class="cell">RAG</text>
  <text x="380" y="232" text-anchor="middle" class="cell">35.05</text>
  <text x="520" y="232" text-anchor="middle" class="cell">30.31</text>
  <text x="655" y="232" text-anchor="middle" class="cell">43.52</text>
  <text x="785" y="232" text-anchor="middle" class="cell">27.58</text>
  <text x="920" y="232" text-anchor="middle" class="cell">38.10</text>

  <text x="55" y="273" class="cell">LangMem</text>
  <text x="380" y="273" text-anchor="middle" class="cell">62.23</text>
  <text x="520" y="273" text-anchor="middle" class="cell">47.92</text>
  <text x="655" y="273" text-anchor="middle" class="cell">71.12</text>
  <text x="785" y="273" text-anchor="middle" class="cell">23.43</text>
  <text x="920" y="273" text-anchor="middle" class="cell">58.10</text>

  <text x="55" y="314" class="cell">Mem0</text>
  <text x="380" y="314" text-anchor="middle" class="cell">67.13</text>
  <text x="520" y="314" text-anchor="middle" class="cell">51.15</text>
  <text x="655" y="314" text-anchor="middle" class="best">72.93</text>
  <text x="785" y="314" text-anchor="middle" class="cell">55.51</text>
  <text x="920" y="314" text-anchor="middle" class="cell">66.88</text>

  <text x="55" y="355" class="cell">Zep</text>
  <text x="380" y="355" text-anchor="middle" class="cell">74.11</text>
  <text x="520" y="355" text-anchor="middle" class="cell">66.04</text>
  <text x="655" y="355" text-anchor="middle" class="cell">67.71</text>
  <text x="785" y="355" text-anchor="middle" class="cell">79.76</text>
  <text x="920" y="355" text-anchor="middle" class="cell">75.14</text>

  <rect x="35" y="365" width="930" height="43" rx="7" fill="#e9f5ee"/>
  <text x="55" y="394" class="best">RGMem</text>
  <text x="380" y="394" text-anchor="middle" class="best">80.15</text>
  <text x="520" y="394" text-anchor="middle" class="best">69.16</text>
  <text x="655" y="394" text-anchor="middle" class="cell">67.71</text>
  <text x="785" y="394" text-anchor="middle" class="best">81.27</text>
  <text x="920" y="394" text-anchor="middle" class="best">78.92</text>

  <line x1="35" y1="420" x2="965" y2="420" class="thin"/>
  <text x="55" y="453" class="oracle">Full-Context</text>
  <text x="380" y="453" text-anchor="middle" class="oracle">83.01</text>
  <text x="520" y="453" text-anchor="middle" class="oracle">66.79</text>
  <text x="655" y="453" text-anchor="middle" class="oracle">49.53</text>
  <text x="785" y="453" text-anchor="middle" class="oracle">58.22</text>
  <text x="920" y="453" text-anchor="middle" class="oracle">71.41</text>
  <line x1="35" y1="472" x2="965" y2="472" class="rule"/>

  <rect x="35" y="485" width="930" height="38" rx="7" fill="#f0f3f8"/>
  <text x="55" y="512" class="model">gpt-4.1-mini</text>

  <text x="55" y="555" class="cell">RAG</text>
  <text x="380" y="555" text-anchor="middle" class="cell">37.94</text>
  <text x="520" y="555" text-anchor="middle" class="cell">37.69</text>
  <text x="655" y="555" text-anchor="middle" class="cell">48.96</text>
  <text x="785" y="555" text-anchor="middle" class="cell">61.83</text>
  <text x="920" y="555" text-anchor="middle" class="cell">51.62</text>

  <text x="55" y="596" class="cell">LangMem</text>
  <text x="380" y="596" text-anchor="middle" class="cell">74.47</text>
  <text x="520" y="596" text-anchor="middle" class="cell">61.06</text>
  <text x="655" y="596" text-anchor="middle" class="cell">67.71</text>
  <text x="785" y="596" text-anchor="middle" class="cell">86.92</text>
  <text x="920" y="596" text-anchor="middle" class="cell">78.05</text>

  <text x="55" y="637" class="cell">Mem0</text>
  <text x="380" y="637" text-anchor="middle" class="cell">62.41</text>
  <text x="520" y="637" text-anchor="middle" class="cell">57.32</text>
  <text x="655" y="637" text-anchor="middle" class="cell">44.79</text>
  <text x="785" y="637" text-anchor="middle" class="cell">66.47</text>
  <text x="920" y="637" text-anchor="middle" class="cell">62.47</text>

  <text x="55" y="678" class="cell">Zep</text>
  <text x="380" y="678" text-anchor="middle" class="cell">79.43</text>
  <text x="520" y="678" text-anchor="middle" class="cell">69.16</text>
  <text x="655" y="678" text-anchor="middle" class="best">73.96</text>
  <text x="785" y="678" text-anchor="middle" class="cell">83.33</text>
  <text x="920" y="678" text-anchor="middle" class="cell">79.09</text>

  <rect x="35" y="688" width="930" height="43" rx="7" fill="#e9f5ee"/>
  <text x="55" y="717" class="best">RGMem</text>
  <text x="380" y="717" text-anchor="middle" class="best">89.58</text>
  <text x="520" y="717" text-anchor="middle" class="best">78.03</text>
  <text x="655" y="717" text-anchor="middle" class="cell">72.86</text>
  <text x="785" y="717" text-anchor="middle" class="best">88.91</text>
  <text x="920" y="717" text-anchor="middle" class="best">86.17</text>

  <line x1="35" y1="743" x2="965" y2="743" class="thin"/>
  <text x="55" y="779" class="oracle">Full-Context</text>
  <text x="380" y="779" text-anchor="middle" class="oracle">88.53</text>
  <text x="520" y="779" text-anchor="middle" class="oracle">77.70</text>
  <text x="655" y="779" text-anchor="middle" class="oracle">71.88</text>
  <text x="785" y="779" text-anchor="middle" class="oracle">92.70</text>
  <text x="920" y="779" text-anchor="middle" class="oracle">87.52</text>
  <line x1="35" y1="803" x2="965" y2="803" class="rule"/>
</svg>
